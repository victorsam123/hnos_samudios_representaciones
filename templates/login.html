
{% extends "base.html" %}
{% block title %}Administración | Wilson Samudio{% endblock %}

{% block content %}
<section class="container section login-section">
    <form method="post" class="form-card login-card">
        <span class="eyebrow">ACCESO RESTRINGIDO</span>
        <h1>Administración</h1>
        <p>Ingresa tus credenciales para gestionar la tienda.</p>

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Usuario</label>
        <input id="username" name="username" required autocomplete="username">

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" required
               autocomplete="current-password">

        <button class="btn btn-primary btn-full" type="submit">Iniciar sesión</button>
    </form>
</section>
{% endblock %}
